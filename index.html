<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Form</title>

</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <h1>Information Form</h1>
            <p>Please fill out this form with your details</p>
        </div>
        
        <form>
            <div class="form-field">
                <div class="float-field">
                    <input type="text" id="fullName" name="fullName" placeholder=" " required>
                    <label for="fullName" class="required">Full Name</label>
                </div>
            </div>
            
            <div class="form-field">
                <div class="float-field">
                    <input type="tel" id="contactNumber" name="contactNumber" placeholder=" " required>
                    <label for="contactNumber" class="required">Contact Number</label>
                </div>
            </div>
            
            <div class="form-field">
                <div class="float-field">
                    <textarea id="address" name="address" placeholder=" " required></textarea>
                    <label for="address" class="required">Address</label>
                </div>
            </div>
            
            <div class="form-field">
                <div class="float-field">
                    <input type="text" id="companyName" name="companyName" placeholder=" ">
                    <label for="companyName">Company Name</label>
                </div>
            </div>
            
            <div class="form-field">
                <div class="float-field">
                    <input type="email" id="email" name="email" placeholder=" " required>
                    <label for="email" class="required">Email Address</label>
                </div>
            </div>
            
            <div class="form-field">
                <label for="department" class="required">Department</label>
                <div class="custom-select">
                    <select id="department" name="department" required>
                        <option value="" disabled selected>Choose a department</option>
                        <option value="hr">HR</option>
                        <option value="sales">Sales</option>
                        <option value="development">Development</option>
                        <option value="marketing">Marketing</option>
                        <option value="others">Others</option>
                    </select>
                </div>
            </div>
            
            <div class="form-field">
                <label class="required">Gender</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="male" name="gender" value="male" required>
                        <label for="male">Male</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female">Female</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="prefer-not-to-say" name="gender" value="prefer-not-to-say">
                        <label for="prefer-not-to-say">Prefer not to say</label>
                    </div>
                </div>
            </div>
            
            <button type="submit" class="submit-button">Submit</button>
        </form>
    </div>
</body>
</html>
